# Core Models Configuration
core_models:
  planner:
    profiles:
      fast:
        model: "Qwen/Qwen2.5-VL-3B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-3B-Instruct"
        downloaded: true
        device: "cuda:0"
        torch_dtype: "bfloat16"
        max_new_tokens: 420
      standard:
        model: "Qwen/Qwen2.5-VL-7B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-7B-Instruct"
        downloaded: true
        device: "cuda:0"
        torch_dtype: "bfloat16"
        max_new_tokens: 512
      strong:
        model: "Qwen/Qwen2.5-VL-32B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-32B-Instruct"
        downloaded: false
        device: "cuda:0"
        torch_dtype: "bfloat16"
        max_new_tokens: 640
    default_profile: "fast"

  judge:
    profiles:
      fast:
        model: "Qwen/Qwen2.5-VL-3B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-3B-Instruct"
        downloaded: true
        device: "cuda:1"
        torch_dtype: "bfloat16"
        max_new_tokens: 256
      standard:
        model: "Qwen/Qwen2.5-VL-7B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-7B-Instruct"
        downloaded: true
        device: "cuda:1"
        torch_dtype: "bfloat16"
        max_new_tokens: 320
      strong:
        model: "Qwen/Qwen2.5-VL-32B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-32B-Instruct"
        downloaded: false
        device: "cuda:1"
        torch_dtype: "bfloat16"
        max_new_tokens: 400
    default_profile: "fast"

  reflector:
    profiles:
      fast:
        model: "Qwen/Qwen2.5-VL-3B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-3B-Instruct"
        downloaded: true
        device: "cuda:2"
        torch_dtype: "bfloat16"
        max_new_tokens: 320
      standard:
        model: "Qwen/Qwen2.5-VL-7B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-7B-Instruct"
        downloaded: true
        device: "cuda:2"
        torch_dtype: "bfloat16"
        max_new_tokens: 400
      strong:
        model: "Qwen/Qwen2.5-VL-32B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-32B-Instruct"
        downloaded: false
        device: "cuda:2"
        torch_dtype: "bfloat16"
        max_new_tokens: 512
    default_profile: "standard"

# Expert Models Configuration
expert_models:
  # Semantic Alignment Group
  semantic_group:
    imagenet_fast:
      name: "ImageNetExpert-Fast"
      model_type: "classification"
      model: "tf_efficientnetv2_s.in21k"
      weights: "${MODEL_DIR}/efficientnetv2_s_in21k.pth"
      downloaded: true
      device: "cuda:3"
      num_classes: 21843
      input_size: [224, 224]
      benchmark: "ImageNet-21K"
      accuracy: 0.8382
      suitable_for: ["broad_category_match", "coarse_semantic_prior", "fast_c2i_screening"]
      unsuitable_for: ["fine_grained_species_confirmation", "class_name_grounded_decision_when_label_space_unknown"]
      evidence_role: "coarse_classification_prior"
      label_space: "imagenet_21k"
      output_interpretability: "class_index_only_without_external_label_map"
      description: "Fast ImageNet-21K classification using local EfficientNetV2-S weights"

    imagenet_strong:
      name: "ImageNetExpert-Strong"
      model_type: "classification"
      model: "tf_efficientnetv2_l.in21k"
      weights: "${MODEL_DIR}/efficientnetv2_l_in21k.pth"
      downloaded: true
      device: "cuda:3"
      num_classes: 21843
      input_size: [224, 224]
      benchmark: "ImageNet-21K"
      accuracy: 0.8543
      suitable_for: ["broad_category_match", "coarse_semantic_prior", "harder_c2i_screening"]
      unsuitable_for: ["fine_grained_species_confirmation", "class_name_grounded_decision_when_label_space_unknown"]
      evidence_role: "stronger_classification_prior"
      label_space: "imagenet_21k"
      output_interpretability: "class_index_only_without_external_label_map"
      description: "High-accuracy ImageNet-21K classification using local EfficientNetV2-L weights"

    imagenet_eva02_large:
      name: "ImageNetExpert-EVA02-Large"
      model_type: "eva_classification"
      model: "timm/eva02_large_patch14_448.mim_in22k_ft_in1k"
      local_path: "${MODEL_DIR}/eva02_l_ckpt"
      downloaded: true
      device: "cuda:3"
      num_classes: 1000
      input_size: [448, 448]
      benchmark: "ImageNet-1K"
      accuracy: 0.9000
      suitable_for: ["label_space_aligned_classification", "fine_grained_c2i", "class_name_grounded_decision"]
      unsuitable_for: ["artifact_assessment"]
      evidence_role: "closed_set_classification_evidence"
      label_space: "imagenet_1k"
      output_interpretability: "class_name_with_local_label_map"
      output_meaning: "Outputs top predicted ImageNet labels and probabilities. Severity is computed as 1 - confidence for the most relevant target match, so lower severity supports semantic alignment while higher severity suggests class mismatch or weak class support."
      description: "EVA-02-L ImageNet-1K classifier for stronger c2i evidence"

    imagenet_eva_giant_224:
      name: "ImageNetExpert-EVA-Giant-224"
      model_type: "eva_classification"
      model: "timm/eva_giant_patch14_224.clip_ft_in1k"
      local_path: "${MODEL_DIR}/eva_giant_224_ckpt"
      downloaded: true
      device: "cuda:3"
      num_classes: 1000
      input_size: [224, 224]
      benchmark: "ImageNet-1K"
      accuracy: 0.8960
      suitable_for: ["label_space_aligned_classification", "fast_stronger_c2i", "class_name_grounded_decision"]
      unsuitable_for: ["artifact_assessment"]
      evidence_role: "closed_set_classification_evidence"
      label_space: "imagenet_1k"
      output_interpretability: "class_name_with_local_label_map"
      description: "EVA giant 224 ImageNet-1K classifier for smaller-image routing"

    bge_candidate_generator:
      name: "BgeCandidateGenerator"
      model_type: "text_embedding"
      model: "BAAI/bge-large-en-v1.5"
      local_path: "${MODEL_DIR}/bge_large_ckpt"
      downloaded: true
      device: "cuda:3"
      benchmark: "text embedding retrieval"
      suitable_for: ["candidate_generation", "confusable_label_retrieval", "fine_grained_label_shortlisting"]
      unsuitable_for: ["direct_image_classification", "artifact_assessment"]
      evidence_role: "candidate_generation_prior"
      label_space: "open_text_to_imagenet_1k"
      output_interpretability: "ranked_candidate_list"
      description: "Deterministic confusable-class candidate generator using BGE embeddings"

    e5_candidate_generator:
      name: "E5CandidateGenerator"
      model_type: "text_embedding"
      model: "intfloat/e5-large-v2"
      local_path: "${MODEL_DIR}/e5_large_ckpt"
      downloaded: true
      device: "cuda:3"
      benchmark: "text embedding retrieval"
      suitable_for: ["candidate_generation", "confusable_label_retrieval", "fine_grained_label_shortlisting"]
      unsuitable_for: ["direct_image_classification", "artifact_assessment"]
      evidence_role: "candidate_generation_prior"
      label_space: "open_text_to_imagenet_1k"
      output_interpretability: "ranked_candidate_list"
      description: "Deterministic confusable-class candidate generator using E5 embeddings"

    clip:
      name: "SemanticExpert"
      model_type: "clip"
      model: "${MODEL_DIR}/clip-vit-base-patch32"
      local_path: "${MODEL_DIR}/clip-vit-base-patch32"
      downloaded: true
      device: "cuda:3"
      benchmark: "ImageNet zero-shot"
      accuracy: 0.70
      suitable_for: ["t2i_alignment", "lookalike_disambiguation", "candidate_reranking", "confusable_disambiguation"]
      unsuitable_for: ["closed_set_classification_confidence_as_primary_evidence"]
      evidence_role: "cross_modal_similarity_evidence"
      label_space: "open_text"
      output_interpretability: "relative_similarity_score"
      output_meaning: "Outputs summary/findings plus severity in [0,1]. Lower severity means the target text or class label is visually compatible with the image; higher severity means poorer text-image agreement or stronger evidence that another candidate label matches better."
      description: "CLIP-based semantic alignment and confusable-label disambiguation"

    clip_score:
      name: "PromptExpert"
      model_type: "clip_score"
      model: "${MODEL_DIR}/clip-vit-base-patch32"
      device: "cuda:3"
      downloaded: true
      suitable_for: ["prompt_alignment_support", "text_image_similarity"]
      unsuitable_for: ["fine_grained_species_confirmation"]
      evidence_role: "prompt_alignment_score"
      label_space: "open_text"
      output_interpretability: "scalar_similarity_score"
      description: "CLIP-based prompt alignment scoring"

  # Animal/Biology Group
  animal_group:
    # animal_pose:
    #   name: "AnimalPoseExpert"
    #   model_type: "yolo_pose"
