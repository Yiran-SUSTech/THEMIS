    #   unsuitable_for: ["species_identification", "fine_grained_pose_landmark_evidence_for_non_coco_animals"]
    #   evidence_role: "coarse_structural_evidence"
    #   label_space: "coco_pose"
    #   output_interpretability: "keypoints_or_detection_proxy"
    #   description: "Animal pose detection"
      
    dog_breed:
