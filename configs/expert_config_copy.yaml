  # Human Group
  human_group:
    body_pose:
      name: "HumanBodyExpert"
      model_type: "yolo_pose"
      model: "yolo11n-pose"
      local_path: "${MODEL_DIR}/yolo/yolo11n-pose.pt"
      downloaded: true
      weights: "coco-pose"
      device: "cuda:4"
      num_keypoints: 17
      description: "Human body pose estimation"
      
    body_pose_strong:
      name: "HumanBodyExpert-Strong"
      model_type: "yolo_pose"
      model: "yolo11x-pose"
      local_path: "${MODEL_DIR}/yolo11x-pose.pt"
      downloaded: true
      weights: "coco-pose"
      device: "cuda:4"
      num_keypoints: 17
      description: "High-accuracy human body pose estimation"
      
    # hand_detection:
    #   name: "HandExpert"
    #   model_type: "detection"
    #   model: "yolo11n"
    #   local_path: "${MODEL_DIR}/yolo/yolo11n.pt"
    #   downloaded: true
