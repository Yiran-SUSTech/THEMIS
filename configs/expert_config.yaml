# =============================================================================
# THEMIS Expert Models Configuration
# =============================================================================

# Core Models Configuration
core_models:
  planner:
    profiles:
      fast:
        model: "Qwen/Qwen2.5-VL-3B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-3B-Instruct"
        device: "cuda:0"
        torch_dtype: "bfloat16"
        max_new_tokens: 420
      standard:
        model: "Qwen/Qwen2.5-VL-7B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-7B-Instruct"
        device: "cuda:0"
        torch_dtype: "bfloat16"
        max_new_tokens: 512
      strong:
        model: "Qwen/Qwen2.5-VL-32B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-32B-Instruct"
        device: "cuda:0"
        torch_dtype: "bfloat16"
        max_new_tokens: 640
    default_profile: "fast"

  judge:
    profiles:
      fast:
        model: "Qwen/Qwen2.5-VL-3B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-3B-Instruct"
        device: "cuda:1"
        torch_dtype: "bfloat16"
        max_new_tokens: 256
      standard:
        model: "Qwen/Qwen2.5-VL-7B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-7B-Instruct"
        device: "cuda:1"
        torch_dtype: "bfloat16"
        max_new_tokens: 320
      strong:
        model: "Qwen/Qwen2.5-VL-32B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-32B-Instruct"
        device: "cuda:1"
        torch_dtype: "bfloat16"
        max_new_tokens: 400
    default_profile: "fast"

  reflector:
    profiles:
      fast:
        model: "Qwen/Qwen2.5-VL-3B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-3B-Instruct"
        device: "cuda:2"
        torch_dtype: "bfloat16"
        max_new_tokens: 320
      standard:
        model: "Qwen/Qwen2.5-VL-7B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-7B-Instruct"
        device: "cuda:2"
        torch_dtype: "bfloat16"
        max_new_tokens: 400
      strong:
        model: "Qwen/Qwen2.5-VL-32B-Instruct"
        local_path: "${MODEL_DIR}/Qwen2.5-VL-32B-Instruct"
        device: "cuda:2"
        torch_dtype: "bfloat16"
        max_new_tokens: 512
    default_profile: "standard"

# Expert Models Configuration
expert_models:
  # Semantic Alignment Group
  semantic_group:
    imagenet_fast:
      name: "ImageNetExpert-Fast"
      model_type: "classification"
      model: "efficientnetv2_s"
      weights: "imagenet"
      device: "cuda:3"
      num_classes: 1000
      input_size: [224, 224]
      description: "Fast ImageNet 1000-class classification"
      
    imagenet_strong:
      name: "ImageNetExpert-Strong"
      model_type: "classification"
      model: "efficientnetv2_l"
      weights: "imagenet"
      device: "cuda:3"
      num_classes: 1000
      input_size: [224, 224]
      description: "High-accuracy ImageNet 1000-class classification"
      
    clip:
      name: "SemanticExpert"
      model_type: "clip"
      model: "openai/clip-vit-base-patch32"
      device: "cuda:3"
      description: "CLIP-based semantic alignment detection"
      
    clip_score:
      name: "PromptExpert"
      model_type: "clip_score"
      model: "openai/clip-vit-base-patch32"
      device: "cuda:3"
      description: "CLIP-based prompt alignment scoring"

  # Animal/Biology Group
  animal_group:
    animal_pose:
      name: "AnimalPoseExpert"
      model_type: "yolo_pose"
      model: "yolo11n-pose"
      weights: "coco-pose"
      device: "cuda:4"
      description: "Animal pose detection"
      
    dog_breed:
      name: "DogBreedExpert"
      model_type: "classification"
      model: "efficientnetv2_s"
      weights: "stanford-dogs"
      device: "cuda:4"
      num_classes: 120
      description: "Dog breed fine-grained classification"
      
    bird_expert:
      name: "BirdExpert"
      model_type: "classification"
      model: "deit_small_patch16_224"
      weights: "cub-200"
      device: "cuda:4"
      num_classes: 200
      description: "Bird species classification"

  # Human Group
  human_group:
    body_pose:
      name: "HumanBodyExpert"
      model_type: "yolo_pose"
      model: "yolo11n-pose"
      weights: "coco-pose"
      device: "cuda:4"
      num_keypoints: 17
      description: "Human body pose estimation"
      
    body_pose_strong:
      name: "HumanBodyExpert-Strong"
      model_type: "yolo_pose"
      model: "yolo11m-pose"
      weights: "coco-pose"
      device: "cuda:4"
      num_keypoints: 17
      description: "High-accuracy human body pose estimation"
      
    hand_detection:
      name: "HandExpert"
      model_type: "detection"
      model: "hadm-local"
      device: "cuda:5"
      description: "Hand artifact detection (extra fingers, malformed hands)"
      
    face_detection:
      name: "FaceExpert"
      model_type: "detection"
      model: "yolo11n-face"
      device: "cuda:4"
      description: "Face structure detection"

  # Scene/Building Group
  scene_group:
    places365:
      name: "SceneExpert"
      model_type: "classification"
      model: "resnet18"
      weights: "places365"
      device: "cuda:3"
      num_classes: 365
      description: "Scene classification (365 categories)"
      
    places365_strong:
      name: "SceneExpert-Strong"
      model_type: "classification"
      model: "resnet50"
      weights: "places365"
      device: "cuda:3"
      num_classes: 365
      description: "High-accuracy scene classification"
      
    building_expert:
      name: "BuildingExpert"
      model_type: "detection"
      model: "yolo11n-detect"
      weights: "building"
      device: "cuda:4"
      description: "Building structure detection"

  # Artifact Detection Group
  artifact_group:
    iqa_fast:
      name: "IQAExpert-Fast"
      model_type: "iqa"
      metrics: ["maniqa"]
      device: "cuda:3"
      description: "Fast image quality assessment"
      
    iqa_default:
      name: "IQAExpert-Default"
      model_type: "iqa"
      metrics: ["maniqa", "musiq"]
      device: "cuda:3"
      description: "Standard image quality assessment"
      
    iqa_richer:
      name: "IQAExpert-Richer"
      model_type: "iqa"
      metrics: ["maniqa", "musiq", "clipiqa"]
      device: "cuda:3"
      description: "Rich image quality assessment"
      
    aigen_detection:
      name: "AIGenExpert"
      model_type: "aigen_detection"
      model: "distildire"
      device: "cuda:4"
      description: "AI-generated image detection"
      
    boundary_artifact:
      name: "BoundaryExpert"
      model_type: "iqa"
      metrics: ["niqe", "brisque"]
      device: "cuda:3"
      description: "Boundary artifact detection"

  # Background Group
  background_group:
    background_removal:
      name: "BackgroundExpert"
      model_type: "segmentation"
      model: "briaai/RMBG-2.0"
      device: "cuda:5"
      description: "Background separation for complex scenes"
      
    complexity:
      name: "ComplexityExpert"
      model_type: "complexity"
      model: "resnet50"
      device: "cuda:3"
      description: "Image complexity assessment"

  # Special Group
  special_group:
    vqa:
      name: "VQAExpert"
      model_type: "vqa"
      model: "Qwen/Qwen2.5-VL-3B-Instruct"
      local_path: "${MODEL_DIR}/Qwen2.5-VL-3B-Instruct"
      device: "cuda:6"
      description: "Visual Question Answering for unresolved questions"
      
    ocr:
      name: "TextExpert"
      model_type: "ocr"
      model: "paddleocr"
      device: "cuda:3"
      description: "Text detection and recognition"

# Expert Selection Strategies
expert_strategies:
  animal_image:
    required: ["imagenet_fast", "animal_pose", "iqa_default"]
    optional: ["dog_breed", "bird_expert", "background_removal"]
    description: "Animal image evaluation strategy"
    
  human_image:
    required: ["imagenet_fast", "body_pose", "hand_detection", "iqa_default"]
    optional: ["face_detection", "background_removal"]
    description: "Human image evaluation strategy"
    
  furniture_image:
    required: ["imagenet_fast", "iqa_default"]
    optional: ["places365", "complexity"]
    description: "Furniture image evaluation strategy"
    
  building_scene:
    required: ["imagenet_fast", "places365", "iqa_default"]
    optional: ["building_expert", "complexity"]
    description: "Building/scene image evaluation strategy"
    
  vehicle_image:
    required: ["imagenet_fast", "iqa_default"]
    optional: ["complexity", "background_removal"]
    description: "Vehicle image evaluation strategy"
    
  plant_image:
    required: ["imagenet_fast", "iqa_default"]
    optional: ["iqa_richer", "complexity"]
    description: "Plant image evaluation strategy"
    
  food_image:
    required: ["imagenet_fast", "iqa_default"]
    optional: ["iqa_richer", "aigen_detection"]
    description: "Food image evaluation strategy"
    
  complex_background:
    required: ["imagenet_fast", "background_removal", "iqa_default"]
    optional: ["complexity", "boundary_artifact"]
    description: "Complex background image evaluation strategy"
    
  general_image:
    required: ["imagenet_fast", "clip", "iqa_default"]
    optional: ["aigen_detection", "vqa"]
    description: "General image evaluation strategy"
    
  fine_grained_class:
    required: ["imagenet_strong", "iqa_richer"]
    optional: ["vqa", "aigen_detection"]
    description: "Fine-grained classification evaluation strategy"

# Device Allocation
device_allocation:
  cuda:0:
    - "planner"
  cuda:1:
    - "judge"
  cuda:2:
    - "reflector"
  cuda:3:
    - "semantic_group"
    - "artifact_group"
    - "scene_group"
  cuda:4:
    - "animal_group"
    - "human_group"
  cuda:5:
    - "background_group"
    - "special_group"
  cuda:6:
    - "vqa"
  cuda:7:
    - "reserved"

# Evaluation Profiles
evaluation_profiles:
  fast:
    planner_profile: "fast"
    judge_profile: "fast"
    reflector_profile: "fast"
    max_experts: 3
    estimated_time: "3-5s"
    
  standard:
    planner_profile: "fast"
    judge_profile: "standard"
    reflector_profile: "standard"
    max_experts: 5
    estimated_time: "5-10s"
    
  accurate:
    planner_profile: "standard"
    judge_profile: "standard"
    reflector_profile: "strong"
    max_experts: 8
    estimated_time: "10-20s"
    
  deep:
    planner_profile: "strong"
    judge_profile: "strong"
    reflector_profile: "strong"
    max_experts: 10
    estimated_time: "15-30s"
